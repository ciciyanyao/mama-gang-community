<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>妈妈社区 · 发布</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-teal-50">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-teal-50 flex flex-col overflow-hidden relative">
<!-- 顶部 -->
<header class="shrink-0 flex items-center justify-between border-b border-slate-100 bg-white px-4 py-3">
<a aria-label="取消发布" class="flex h-8 w-8 items-center justify-center rounded-full text-slate-600 transition hover:bg-teal-50" href="home.html">
<iconify-icon icon="mdi:close" width="22"></iconify-icon>
</a>
<span class="text-sm font-semibold text-slate-900">发布新帖</span>
<button class="rounded-full bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white transition hover:bg-rose-600" onclick="submitPost()">发布</button>
</header>
<!-- 主滚动区 -->
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden px-4 pb-4 pt-3">
<!-- 发布身份 -->
<div class="flex items-center gap-3 rounded-2xl bg-white p-3.5 shadow-sm ring-1 ring-slate-100">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-emerald-600 to-teal-400 text-lg" id="publishAvatar">👩</div>
<div class="min-w-0 flex-1">
<p class="text-sm font-semibold text-slate-900" id="publishName">小丽妈妈</p>
<p class="mt-0.5 text-[11px] text-slate-400" id="publishHint">公开显示昵称，同城妈妈可以看到你</p>
</div>
<div class="flex items-center gap-2">
<span class="text-[11px] text-slate-400">匿名</span>
<button aria-label="匿名发布开关" class="relative h-6 w-11 shrink-0 rounded-full bg-slate-200 transition" id="anonSwitch" onclick="toggleAnon()">
<span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all" id="anonKnob"></span>
</button>
</div>
</div>
<!-- 选择分类 -->
<section class="mt-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
<h2 class="text-[13px] font-semibold text-slate-900">发布到哪个板块</h2>
<div class="mt-3 flex flex-wrap gap-2">
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">求职</button>
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">职场</button>
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">育儿</button>
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">情绪</button>
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">政策</button>
<button class="pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600" onclick="pickCat(this)">树洞</button>
</div>
</section>
<!-- 标题与正文 -->
<section class="mt-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
<input class="w-full border-b border-slate-100 pb-2.5 text-sm font-semibold text-slate-800 placeholder:text-slate-400 focus:border-rose-200 focus:outline-none" id="postTitle" maxlength="40" placeholder="写个标题，让姐妹一眼看懂" type="text"/>
<textarea class="mt-3 w-full resize-none text-sm leading-relaxed text-slate-700 placeholder:text-slate-400 focus:outline-none" id="postBody" maxlength="500" oninput="updateCount()" placeholder="说说你的经历、困惑或经验，越具体越容易被回复…" rows="6"></textarea>
<div class="mt-1 flex items-center justify-between text-[11px] text-slate-400">
<span class="flex items-center gap-1">
<iconify-icon icon="mdi:information-outline" width="13"></iconify-icon>请勿包含联系方式与收款信息
          </span>
<span><span id="charCount">0</span>/500</span>
</div>
</section>
<!-- 图片 -->
<section class="mt-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
<div class="flex items-center justify-between">
<h2 class="text-[13px] font-semibold text-slate-900">添加图片</h2>
<span class="text-[11px] text-slate-400">最多 9 张</span>
</div>
<div class="mt-3 grid grid-cols-3 gap-2">
<div class="image-slot flex aspect-square items-center justify-center overflow-hidden rounded-xl bg-teal-50 border border-dashed border-slate-200">
<img alt="Selected craft sample photo thumbnail" class="h-full w-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-10-04/5d5cc0e437104ed4b83486401695ec4f.jpg"/>
</div>
<div class="image-slot flex aspect-square items-center justify-center overflow-hidden rounded-xl bg-teal-50 border border-dashed border-slate-200">
<img alt="Selected handwritten notes photo thumbnail" class="h-full w-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-10-04/fcef537e056146389e291a470efda673.jpg"/>
</div>
<button class="flex aspect-square flex-col items-center justify-center gap-1 rounded-xl bg-teal-50 text-slate-400 border border-dashed border-slate-200 transition hover:bg-emerald-50 hover:text-emerald-600" onclick="document.getElementById('realImageUpload').click()">
<iconify-icon icon="mdi:camera-plus-outline" width="22"></iconify-icon>
<span class="text-[10px]">添加</span>
</button>
</div>
</section>
<!-- 话题标签 -->
<section class="mt-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
<div class="flex items-center justify-between">
<h2 class="text-[13px] font-semibold text-slate-900">添加话题</h2>
<button class="flex items-center gap-0.5 text-[11px] font-medium text-emerald-600" onclick="addTag()">
<iconify-icon icon="mdi:plus" width="14"></iconify-icon>自定义
          </button>
</div>
<div class="mt-3 flex flex-wrap items-center gap-2" id="tagBox">
<button class="tag-chip rounded-full bg-teal-50 px-3 py-1 text-[11px] text-slate-500" onclick="toggleTag(this)">#宝妈兼职</button>
<button class="tag-chip rounded-full bg-teal-50 px-3 py-1 text-[11px] text-slate-500" onclick="toggleTag(this)">#产后情绪</button>
<button class="tag-chip rounded-full bg-teal-50 px-3 py-1 text-[11px] text-slate-500" onclick="toggleTag(this)">#育儿日常</button>
<button class="tag-chip rounded-full bg-teal-50 px-3 py-1 text-[11px] text-slate-500" onclick="toggleTag(this)">#政策解读</button>
</div>
</section>
<!-- 社区公约 -->
<section class="mt-3 rounded-2xl bg-gradient-to-br from-emerald-50 to-orange-50 p-4">
<div class="flex items-center gap-2 text-emerald-600">
<iconify-icon icon="mdi:shield-heart-outline" width="18"></iconify-icon>
<span class="text-[13px] font-semibold">妈妈社区公约</span>
</div>
<ul class="mt-2 space-y-1.5 text-[11px] leading-relaxed text-slate-600">
<li>· 真实分享，不发布虚假兼职与引流信息</li>
<li>· 尊重彼此，禁止攻击他人育儿方式</li>
<li>· 涉及医疗与政策内容请注明信息来源</li>
</ul>
</section>
<button class="mt-4 w-full rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-500 py-3.5 text-sm font-bold text-white shadow-lg shadow-rose-200" onclick="submitPost()">
        立即发布
      </button>
<p class="mt-2 text-center text-[11px] text-slate-400">发布后可在「我的 - 我的帖子」中修改</p>
</main>
<!-- 底部 Tab -->
<nav class="shrink-0 border-t border-slate-100 bg-white px-1 pb-1.5 pt-1">
<div class="flex items-end justify-around">
<a class="flex w-16 flex-col items-center gap-0.5 pt-1 text-slate-400" href="home.html">
<iconify-icon icon="mdi:forum-outline" width="23"></iconify-icon>
<span class="text-[10px]">论坛</span>
</a>
<a class="flex w-16 flex-col items-center gap-0.5 pt-1 text-slate-400" href="messages.html">
<iconify-icon icon="mdi:bell-outline" width="23"></iconify-icon>
<span class="text-[10px]">消息</span>
</a>
<a aria-label="发布新帖" class="relative flex w-16 flex-col items-center" href="publish.html">
<span class="-mt-5 flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-emerald-600 to-teal-500 text-white shadow-lg shadow-rose-200 ring-4 ring-white">
<iconify-icon class="rotate-45" icon="mdi:plus" width="28"></iconify-icon>
</span>
<span class="mt-0.5 text-[10px] font-semibold text-emerald-600">发布</span>
</a>
<a class="flex w-16 flex-col items-center gap-0.5 pt-1 text-slate-400" href="treehole.html">
<iconify-icon icon="mdi:leaf" width="23"></iconify-icon>
<span class="text-[10px]">树洞</span>
</a>
<a class="flex w-16 flex-col items-center gap-0.5 pt-1 text-slate-400" href="profile.html">
<iconify-icon icon="mdi:account-outline" width="23"></iconify-icon>
<span class="text-[10px]">我的</span>
</a>
</div>
</nav>
<div class="absolute inset-0 hidden flex-col items-center justify-center bg-slate-900/40 px-8" id="successPanel">
<div class="w-full rounded-3xl bg-white px-6 py-7 text-center shadow-xl">
<div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-emerald-600 to-teal-500 text-white">
<iconify-icon icon="mdi:check" width="30"></iconify-icon>
</div>
<h3 class="mt-3 text-base font-bold text-slate-900">发布成功</h3>
<p class="mt-1 text-xs leading-relaxed text-slate-500">帖子已进入审核，通常 1 分钟内会出现在论坛里。</p>
<div class="mt-5 flex gap-3">
<button class="flex-1 rounded-xl bg-teal-50 py-2.5 text-xs font-semibold text-slate-600" onclick="closeSuccess()">继续编辑</button>
<a class="flex-1 rounded-xl bg-emerald-600 py-2.5 text-xs font-semibold text-white" href="home.html">回论坛看看</a>
</div>
</div>
</div>
<div class="pointer-events-none absolute left-1/2 top-1/2 hidden -translate-x-1/2 -translate-y-1/2 rounded-xl bg-slate-900/85 px-4 py-2.5 text-xs text-white" id="toast"></div>
</div>
<script>
    var isAnon = false;

    function pickCat(el) {
      var chips = document.querySelectorAll('.pub-chip');
      for (var i = 0; i < chips.length; i++) {
        chips[i].className = 'pub-chip rounded-full bg-teal-50 px-3.5 py-1.5 text-xs font-medium text-slate-600';
      }
      el.className = 'pub-chip rounded-full bg-emerald-600 px-3.5 py-1.5 text-xs font-medium text-white';
    }

    function toggleTag(el) {
      var on = el.classList.contains('bg-emerald-50');
      if (on) {
        el.className = 'tag-chip rounded-full bg-teal-50 px-3 py-1 text-[11px] text-slate-500';
      } else {
        el.className = 'tag-chip rounded-full bg-emerald-50 px-3 py-1 text-[11px] font-medium text-emerald-600';
      }
    }

    function addTag() {
      var box = document.getElementById('tagBox');
      var name = prompt('输入话题名称（不需要带 #）');
      if (!name) { return; }
      var btn = document.createElement('button');
      btn.className = 'tag-chip rounded-full bg-emerald-50 px-3 py-1 text-[11px] font-medium text-emerald-600';
      btn.textContent = '#' + name.replace(/^#/, '');
      btn.setAttribute('onclick', 'toggleTag(this)');
      box.appendChild(btn);
    }

    function addSlot(btn) {
      var grid = btn.parentNode;
      var slot = document.createElement('div');
      slot.className = 'image-slot flex aspect-square items-center justify-center overflow-hidden rounded-xl bg-teal-50 border border-dashed border-slate-200';
      var img = document.createElement('img');
      img.src = '/agent-py/static/source/images/placeholder.svg';
      img.alt = 'Newly added photo thumbnail for the post';
      img.className = 'h-full w-full object-cover';
      slot.appendChild(img);
      grid.insertBefore(slot, btn);
      if (grid.querySelectorAll('.image-slot').length >= 9) {
        btn.classList.add('hidden');
      }
    }

    function toggleAnon() {
      isAnon = !isAnon;
      var sw = document.getElementById('anonSwitch');
      var knob = document.getElementById('anonKnob');
      if (isAnon) {
        sw.className = 'relative h-6 w-11 shrink-0 rounded-full bg-emerald-600 transition';
        knob.className = 'absolute left-[22px] top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all';
        document.getElementById('publishAvatar').textContent = '🫥';
        document.getElementById('publishName').textContent = '匿名用户';
        document.getElementById('publishHint').textContent = '将以「匿名用户」展示，昵称不会公开';
      } else {
        sw.className = 'relative h-6 w-11 shrink-0 rounded-full bg-slate-200 transition';
        knob.className = 'absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all';
        document.getElementById('publishAvatar').textContent = '👩';
        document.getElementById('publishName').textContent = '小丽妈妈';
        document.getElementById('publishHint').textContent = '公开显示昵称，同城妈妈可以看到你';
      }
    }

    function updateCount() {
      var v = document.getElementById('postBody').value;
      document.getElementById('charCount').textContent = v.length;
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(function () { t.classList.add('hidden'); }, 1600);
    }

    function submitPost() {
      var title = document.getElementById('postTitle').value.trim();
      var body = document.getElementById('postBody').value.trim();
      if (!title) { showToast('还没写标题哦'); return; }
      if (body.length < 10) { showToast('正文再写几句吧，至少 10 个字'); return; }
      document.getElementById('successPanel').classList.remove('hidden');
      document.getElementById('successPanel').classList.add('flex');
    }

    function closeSuccess() {
      var p = document.getElementById('successPanel');
      p.classList.add('hidden');
      p.classList.remove('flex');
    }
  </script>
<!-- 隐藏的文件上传控件 -->
<input type="file" id="realImageUpload" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
<div id="imagePreviewContainer" class="mt-3 grid grid-cols-3 gap-2"></div>

<script>
function handleFileSelect(event) {
    const files = event.target.files;
    const container = document.getElementById('imagePreviewContainer');
    
    // 最多只给选9张
    if (container.children.length + files.length > 9) {
        alert("最多只能上传9张图片哦！");
        return;
    }

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'image-slot flex aspect-square items-center justify-center overflow-hidden rounded-xl bg-teal-50 border border-dashed border-slate-200';
            imgDiv.innerHTML = `<img src="${e.target.result}" class="h-full w-full object-cover">`;
            container.appendChild(imgDiv);
        }
        reader.readAsDataURL(file);
    }
}
</script>
</body>
</html>
